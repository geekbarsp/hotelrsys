<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1500" viewBox="0 0 2400 1500" role="img" aria-labelledby="title desc">
  <title id="title">LuxeStay Premium ERD</title>
  <desc id="desc">Entity relationship diagram for the LuxeStay Premium Hotel Reservation and Management System.</desc>
  <defs>
    <style>
      .bg { fill: #f6f4ef; }
      .card { fill: #ffffff; stroke: #171717; stroke-width: 2; rx: 22; ry: 22; }
      .header { fill: #d4af37; rx: 22; ry: 22; }
      .title { font-family: Segoe UI, Arial, sans-serif; font-size: 26px; font-weight: 700; fill: #171717; }
      .field { font-family: Segoe UI, Arial, sans-serif; font-size: 18px; fill: #303030; }
      .small { font-family: Segoe UI, Arial, sans-serif; font-size: 16px; fill: #5a5a5a; }
      .rel { stroke: #5b6470; stroke-width: 4; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .rel-label { font-family: Segoe UI, Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #305f85; }
      .legend-box { fill: #fcfbf8; stroke: #171717; stroke-width: 2; rx: 18; ry: 18; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="2400" height="1500"/>

  <text x="70" y="62" class="title" style="font-size: 36px;">LuxeStay Premium Hotel Reservation and Management System</text>
  <text x="70" y="95" class="small">Entity Relationship Diagram</text>

  <g transform="translate(70,130)">
    <rect class="card" width="420" height="190"/>
    <rect class="header" width="420" height="54"/>
    <text x="20" y="35" class="title">HOTEL</text>
    <text x="20" y="88" class="field">hotel_id (PK)</text>
    <text x="20" y="116" class="field">hotel_name</text>
    <text x="20" y="144" class="field">city</text>
    <text x="20" y="172" class="field">district</text>
  </g>

  <g transform="translate(70,390)">
    <rect class="card" width="420" height="245"/>
    <rect class="header" width="420" height="54"/>
    <text x="20" y="35" class="title">ROOM</text>
    <text x="20" y="88" class="field">room_id (PK)</text>
    <text x="20" y="116" class="field">hotel_id (FK)</text>
    <text x="20" y="144" class="field">room_name</text>
    <text x="20" y="172" class="field">room_type</text>
    <text x="20" y="200" class="field">capacity</text>
    <text x="20" y="228" class="field">base_price</text>
    <text x="20" y="256" class="field">status</text>
  </g>

  <g transform="translate(700,130)">
    <rect class="card" width="460" height="220"/>
    <rect class="header" width="460" height="54"/>
    <text x="20" y="35" class="title">USER_ACCOUNT</text>
    <text x="20" y="88" class="field">user_id (PK)</text>
    <text x="20" y="116" class="field">full_name</text>
    <text x="20" y="144" class="field">username</text>
    <text x="20" y="172" class="field">password</text>
    <text x="20" y="200" class="field">role</text>
  </g>

  <g transform="translate(1330,130)">
    <rect class="card" width="430" height="220"/>
    <rect class="header" width="430" height="54"/>
    <text x="20" y="35" class="title">EMPLOYEE</text>
    <text x="20" y="88" class="field">employee_id (PK)</text>
    <text x="20" y="116" class="field">employee_code</text>
    <text x="20" y="144" class="field">full_name</text>
    <text x="20" y="172" class="field">position</text>
    <text x="20" y="200" class="field">duty_status, bonus, strikes</text>
  </g>

  <g transform="translate(700,420)">
    <rect class="card" width="500" height="340"/>
    <rect class="header" width="500" height="54"/>
    <text x="20" y="35" class="title">BOOKING</text>
    <text x="20" y="88" class="field">booking_id (PK)</text>
    <text x="20" y="116" class="field">user_id (FK)</text>
    <text x="20" y="144" class="field">room_id (FK)</text>
    <text x="20" y="172" class="field">handled_by (FK)</text>
    <text x="20" y="200" class="field">guest_name</text>
    <text x="20" y="228" class="field">checkin_date</text>
    <text x="20" y="256" class="field">checkout_date</text>
    <text x="20" y="284" class="field">booking_type</text>
    <text x="20" y="312" class="field">status, receipt_no, total_amount</text>
  </g>

  <g transform="translate(700,840)">
    <rect class="card" width="430" height="190"/>
    <rect class="header" width="430" height="54"/>
    <text x="20" y="35" class="title">PAYMENT</text>
    <text x="20" y="88" class="field">payment_id (PK)</text>
    <text x="20" y="116" class="field">booking_id (FK)</text>
    <text x="20" y="144" class="field">payment_method</text>
    <text x="20" y="172" class="field">amount, payment_status, paid_at</text>
  </g>

  <g transform="translate(1330,430)">
    <rect class="card" width="430" height="165"/>
    <rect class="header" width="430" height="54"/>
    <text x="20" y="35" class="title">ADD_ON</text>
    <text x="20" y="88" class="field">add_on_id (PK)</text>
    <text x="20" y="116" class="field">add_on_name</text>
    <text x="20" y="144" class="field">price</text>
  </g>

  <g transform="translate(1330,665)">
    <rect class="card" width="430" height="215"/>
    <rect class="header" width="430" height="54"/>
    <text x="20" y="35" class="title">BOOKING_ADD_ON</text>
    <text x="20" y="88" class="field">booking_add_on_id (PK)</text>
    <text x="20" y="116" class="field">booking_id (FK)</text>
    <text x="20" y="144" class="field">add_on_id (FK)</text>
    <text x="20" y="172" class="field">quantity</text>
    <text x="20" y="200" class="field">subtotal</text>
  </g>

  <g transform="translate(70,790)">
    <rect class="card" width="420" height="165"/>
    <rect class="header" width="420" height="54"/>
    <text x="20" y="35" class="title">LOYALTY_ACCOUNT</text>
    <text x="20" y="88" class="field">loyalty_id (PK)</text>
    <text x="20" y="116" class="field">user_id (FK)</text>
    <text x="20" y="144" class="field">current_points, tier</text>
  </g>

  <g transform="translate(70,1040)">
    <rect class="card" width="520" height="210"/>
    <rect class="header" width="520" height="54"/>
    <text x="20" y="35" class="title">POINTS_TRANSACTION</text>
    <text x="20" y="88" class="field">points_txn_id (PK)</text>
    <text x="20" y="116" class="field">loyalty_id (FK)</text>
    <text x="20" y="144" class="field">booking_id (FK)</text>
    <text x="20" y="172" class="field">points</text>
    <text x="20" y="200" class="field">transaction_type, transaction_date</text>
  </g>

  <g transform="translate(1330,1030)">
    <rect class="card" width="430" height="165"/>
    <rect class="header" width="430" height="54"/>
    <text x="20" y="35" class="title">REWARD</text>
    <text x="20" y="88" class="field">reward_id (PK)</text>
    <text x="20" y="116" class="field">reward_name</text>
    <text x="20" y="144" class="field">points_cost, description</text>
  </g>

  <g transform="translate(700,1100)">
    <rect class="card" width="500" height="190"/>
    <rect class="header" width="500" height="54"/>
    <text x="20" y="35" class="title">REWARD_REDEMPTION</text>
    <text x="20" y="88" class="field">redemption_id (PK)</text>
    <text x="20" y="116" class="field">loyalty_id (FK)</text>
    <text x="20" y="144" class="field">reward_id (FK)</text>
    <text x="20" y="172" class="field">redeemed_at</text>
  </g>

  <path class="rel" d="M280 320 L280 390"/>
  <text x="246" y="350" class="rel-label">1</text>
  <text x="246" y="382" class="rel-label">M</text>

  <path class="rel" d="M930 350 L930 420"/>
  <text x="895" y="382" class="rel-label">1</text>
  <text x="895" y="414" class="rel-label">M</text>

  <path class="rel" d="M490 510 L700 510"/>
  <text x="520" y="496" class="rel-label">1</text>
  <text x="670" y="496" class="rel-label">M</text>

  <path class="rel" d="M1330 510 L1200 510"/>
  <text x="1298" y="496" class="rel-label">1</text>
  <text x="1210" y="496" class="rel-label">M</text>

  <path class="rel" d="M915 760 L915 840"/>
  <text x="880" y="792" class="rel-label">1</text>
  <text x="880" y="830" class="rel-label">M</text>

  <path class="rel" d="M1200 720 L1330 720"/>
  <text x="1224" y="706" class="rel-label">1</text>
  <text x="1298" y="706" class="rel-label">M</text>

  <path class="rel" d="M1545 595 L1545 665"/>
  <text x="1511" y="625" class="rel-label">1</text>
  <text x="1511" y="657" class="rel-label">M</text>

  <path class="rel" d="M840 350 L840 720 L490 720 L490 872"/>
  <text x="805" y="384" class="rel-label">1</text>
  <text x="458" y="860" class="rel-label">1</text>

  <path class="rel" d="M280 955 L280 1040"/>
  <text x="246" y="988" class="rel-label">1</text>
  <text x="246" y="1028" class="rel-label">M</text>

  <path class="rel" d="M700 1165 L590 1165 L590 1145"/>
  <path class="rel" d="M950 760 L950 960 L590 960 L590 1145"/>
  <text x="666" y="1150" class="rel-label">M</text>
  <text x="915" y="794" class="rel-label">1</text>

  <path class="rel" d="M490 872 L620 872 L620 1195 L700 1195"/>
  <text x="522" y="858" class="rel-label">1</text>
  <text x="666" y="1182" class="rel-label">M</text>

  <path class="rel" d="M1330 1112 L1200 1112"/>
  <text x="1298" y="1098" class="rel-label">1</text>
  <text x="1210" y="1098" class="rel-label">M</text>

  <g transform="translate(1840,170)">
    <rect class="legend-box" width="470" height="220"/>
    <text x="24" y="36" class="title" style="font-size: 24px;">Legend</text>
    <text x="24" y="76" class="field">PK = Primary Key</text>
    <text x="24" y="106" class="field">FK = Foreign Key</text>
    <text x="24" y="146" class="field">1 = One</text>
    <text x="24" y="176" class="field">M = Many</text>
    <text x="24" y="206" class="small">Designed for booking, loyalty, staff, and hotel operations.</text>
  </g>
</svg>
