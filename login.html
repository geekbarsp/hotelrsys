<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LuxeStay | Access Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="static/style.css">
</head>
<body class="page-shell" data-page="login">
    <div class="app-layer auth-shell">
        <div class="section-shell auth-grid">
            <section class="auth-showcase p-8 sm:p-10 lg:p-12">
                <div class="relative z-10 flex h-full flex-col justify-between">
                    <div>
                        <p class="text-[0.7rem] font-extrabold uppercase tracking-[0.32em] text-white/70">Member Access</p>
                        <h1 class="mt-4 font-display text-6xl font-semibold leading-[0.9] text-white">Return to <span class="gold-text">LuxeStay</span>.</h1>
                        <p class="mt-5 max-w-xl text-base leading-7 text-white/78">Access your profile, booking history, loyalty points, and reservations from one GitHub-ready LuxeStay portal.</p>
                    </div>
                </div>
            </section>

            <section class="auth-panel p-8 sm:p-10">
                <div class="mx-auto flex h-full max-w-md flex-col justify-center">
                    <a href="index.html" class="text-[0.7rem] font-extrabold uppercase tracking-[0.28em] text-gray-400">Back to Front Desk</a>
                    <h2 class="mt-4 font-display text-5xl font-semibold text-[#171717]">Member sign in</h2>
                    <div id="auth-error" class="mt-6"></div>
                    <form id="login-form" class="mt-8 space-y-5">
                        <div>
                            <label class="input-label" for="username">Username</label>
                            <input id="username" type="text" name="username" required class="luxury-input" placeholder="Enter your username">
                        </div>
                        <div>
                            <label class="input-label" for="password">Password</label>
                            <input id="password" type="password" name="password" required class="luxury-input" placeholder="Enter your password">
                        </div>
                        <button type="submit" class="btn-gold w-full">Enter Portal</button>
                    </form>
                    <p class="mt-8 text-sm text-gray-500">Not a member yet? <a href="signup.html" class="font-semibold text-[#171717] transition hover:text-[#aa771c]">Create an account</a></p>
                </div>
            </section>
        </div>
    </div>

    <script src="static/github-runtime.js"></script>
    <script src="static/github-pages.js"></script>
</body>
</html>
